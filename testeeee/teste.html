<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alura Challenge - FrontEnd</title>
    <link rel="shortcut icon" href="./img/icon-mergulhador.ico" type="image/x-icon">
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Roboto+Mono&display=swap"
    rel="stylesheet"/>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="grid.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="conteudo.css">
    <link rel="stylesheet" href="aside.css">
    <link rel="stylesheet" href="dark.css">
</head>

<STYLE>A {text-decoration: none;} </STYLE>
<body>
  <section id="pagina">

    <!-- Aqui fica a logo, a searchbar e a parte do usuário. -->
    <header>
      <h1 class="logoalura">
        <img src="./img/Logo.svg" alt="Logo Alura Dev" />
        </h1>

        <div>
          <input class="headersearch" type="search" placeholder="Busque por algo">
      </div>
      <img class="fotousuario" src="./img/Photo.svg" alt="foto do usuário">
      <a class="nomeusuario" href="#">Harry</a>

    </header>

    <!-- Aqui fica o menu lateral esquerdo. -->
    <nav class="menu">
      <h2 class="menutitulo">Menu</h2>
        <ul class="menulista">
          <li>

          <a href="./teste.html">
            <div class="menuicon">
              <img src="img/Icon.svg"
                alt="Editor de código" class="iconeditor"/>
            </div>
              <p class="editor">Editor de código</p>
          </a>

          <a href="./comunidade.html">
              <div class="menuicon">
                  <img src="./img/IconComunidade.svg"
                    alt="Comunidade" class="iconcomunidade"/>
              </div>
                <p class="comunidade">Comunidade</p>
          </a>
          </li>
        </ul>
    </nav>


    <!-- O editor de código. -->
    <main>
    <section id="conteudo" class="retangulo">
      <div class="editordecodigo">

          <img class="botao" src="./img/mac_buttons.svg">

          <code class="preview hljs" contenteditable="true" aria-label="Editor de código">function teste() {}</code>
          
      </div>
  </section>
    <button class="highlight">Visualizar com o highlight</button>
  </main>

  

    <!-- Campo para inserir nome e descrição do projeto. -->
    <aside>

      <div class="projetoinfo">
        <h2 class="seuprojeto">Seu projeto</h2>
        <input 
          class="input"
          type="text"
          id="nomedoprojeto"
          placeholder="Nome do seu projeto"
          data-title
        /> 

        <textarea
          class="input"
          id="descricaoprojeto"
          rows="5"
          placeholder="Descrição do projeto"
          data-description
        ></textarea>

        <div class="codigopersonalizado">
          <h2 class="personalizacao">Personalização</h2>
          <select id="escolhaotipo" data-codeLang>
            <option value="Javascript">Javascript</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
         </select>

        <!-- Campo do editor de cor. -->
          <input
            id="editordecor"
            type="color"
            value="#6BD1FF"
            class="projectcolor"
            data-color>
          </div>

         <button data-save-btn class="projectsave">
            Salvar projeto
         </button>
    </aside>


  </section>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>    
    <script src="colorPicker.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.3.1/highlight.min.js"></script>
   <script src="index.js"></script>
</body>
</html>
